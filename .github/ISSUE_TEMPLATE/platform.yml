name: A platform or a feature
description: Ask for a connector for your platform, or for something a connector should do.
labels: [enhancement]
body:
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "Webflow, Shopify, Squarespace, Hugo, Astro…"
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: What you need
      description: What you want agents to get from your site, and what your platform lets you change (head code, files at the root, a CMS API).
    validations:
      required: true
